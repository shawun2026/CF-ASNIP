name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, out: asnip-linux-amd64 }
          - { goos: linux,   goarch: arm64, out: asnip-linux-arm64 }
          - { goos: windows, goarch: amd64, out: asnip-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: vet & test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.out }}" .

      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
          generate_release_notes: true

  checksums:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: note
        run: echo "二进制由 release 任务分别上传，校验和可在各平台的 sha256sum 中自行生成"

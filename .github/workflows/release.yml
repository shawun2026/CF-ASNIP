name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: vet & test
        run: |
          go vet ./...
          go test ./...

      - name: build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/asnip-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/asnip-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/asnip-windows-amd64.exe .
          cd dist
          sha256sum asnip-linux-amd64 asnip-linux-arm64 asnip-windows-amd64.exe > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: asnip-binaries
          path: dist/

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asnip-linux-amd64
            dist/asnip-linux-arm64
            dist/asnip-windows-amd64.exe
            dist/SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
